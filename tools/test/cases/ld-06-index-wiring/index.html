<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter drop</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { applyTheme, header, card, emptyState } from './kit/parts.js';
import { openStore } from './kit/store.js';
import { renderMenu, startGame } from './screens/game.js';
import { bestAfter } from './seams/best.js';

const get = p => fetch(p).then(r => r.json());
const [theme, levels] = await Promise.all([get('theme.json'), get('data/levels.json')]);
applyTheme(theme);
const store = openStore('letter-drop');
const root = document.getElementById('app');
const main = document.createElement('main');
root.replaceChildren(header('Letter drop'), main);

const state = {
  levels,
  best: (await store.get('best')) ?? 0,
  actions: {
    play(level) {
      // Test hook: verifiers drive the game through window.__game.
      window.__game = startGame(main, level, async score => {
        state.best = bestAfter(state.best, score);
        await store.set('best', state.best);
        main.replaceChildren(card({ title: 'Game over', body: emptyState(`You scored ${score}. Best ${state.best}.`) }));
        setTimeout(menu, 1500);
      });
    },
  },
};
function menu() { renderMenu(main, state); }
const q = new URLSearchParams(location.search);
const auto = q.get('level');
if (auto != null && levels[Number(auto)]) state.actions.play(levels[Number(auto)]); else menu();
</script>
</body>
</html>
