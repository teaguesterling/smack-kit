<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter drop</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { applyTheme, header, card, emptyState } from './kit/parts.js';
import { openStore } from './kit/store.js';
import { call } from './kit/uprompt.js';
import { renderMenu, startGame } from './screens/game.js';

const get = p => fetch(p).then(r => r.json());
const [theme, levels] = await Promise.all([get('theme.json'), get('data/levels.json')]);
applyTheme(theme);
const store = openStore('letter-drop');
const root = document.getElementById('app');
const main = document.createElement('main');
root.replaceChildren(header('Letter drop'), main);

const state = {
  levels,
  actions: {
    play(level) {
      // Test hook: verifiers drive the game through window.__game.
      window.__game = startGame(main, level, score => {
        const over = card({ title: 'Game over', body: emptyState(`You scored ${score}.`) });
        main.replaceChildren(over);
        cheer(score).then(text => { if (text) over.append(Object.assign(document.createElement('p'), { className: 'cheer', textContent: text })); });
        setTimeout(menu, 1500);
      });
    },
  },
};
function menu() { renderMenu(main, state); }
/** One encouraging sentence from the model (app.json models.cheer). No answer, no message: the score still shows. */
async function cheer(score) {
  try {
    const r = await call('cheer', [
      { role: 'system', content: 'You cheer on a young child learning letters. Answer with one short, kind sentence.' },
      { role: 'user', content: `I scored ${score} in Letter drop.` },
    ]);
    return r.text.trim().slice(0, 140);
  } catch { return ''; }
}
const q = new URLSearchParams(location.search);
const auto = q.get('level');
if (auto != null && levels[Number(auto)]) state.actions.play(levels[Number(auto)]); else menu();
</script>
</body>
</html>
